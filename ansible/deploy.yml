---
- name: Deploy Docker, Docker Compose, Nginx, Node.js app and MongoDB
  hosts: all
  become: yes

  vars:
    app_dir: /opt/nodeapp

  tasks:

    - name: Update apt packages
      apt:
        update_cache: yes

    - name: Install required packages
      apt:
        name:
          - docker.io
          - docker-compose
          - npm
        state: present

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory

    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes

    - name: Copy docker-compose file
      copy:
        dest: "{{ app_dir }}/docker-compose.yml"
        content: |
          version: '3'

          services:

            nginx:
              image: nginx:latest
              container_name: nginx
              ports:
                - "80:80"

            mongodb:
              image: mongo:latest
              container_name: mongodb
              ports:
                - "27017:27017"

            nodeapp:
              image: node:18
              container_name: nodeapp
              working_dir: /app
              volumes:
                - ./app:/app
              command: >
                sh -c "npm install &&
                       npm install -g pm2 &&
                       pm2-runtime app.js"
              ports:
                - "3000:3000"

    - name: Create sample Node.js application
      copy:
        dest: "{{ app_dir }}/app/app.js"
        content: |
          const http = require('http');

          const server = http.createServer((req, res) => {
              res.writeHead(200, {'Content-Type': 'text/plain'});
              res.end('E-Commerce Store
            - Laptop $1200
             - Phone $800');
          });

          server.listen(3000, () => {
              console.log('Server running on port 3000');
          });

    - name: Create package.json
      copy:
        dest: "{{ app_dir }}/app/package.json"
        content: |
          {
            "name": "nodeapp",
            "version": "1.0.0",
            "main": "app.js"
          }

    - name: Run Docker Compose
      shell: |
        cd {{ app_dir }}
        docker-compose up -d
