---
- name: Phase 1 - Install Python (using raw module)
  hosts: all
  become: yes
  gather_facts: no
  
  tasks:
    - name: Update apt cache
      raw: apt update
      changed_when: true
      ignore_errors: yes

    - name: Install Python3 and required packages
      raw: apt install -y python3 python3-distutils python3-apt
      changed_when: true

    - name: Ensure python3 is available
      raw: which python3 || (apt install -y python3)
      changed_when: true

- name: Phase 2 - Deploy Docker, Docker Compose, Nginx, Node.js app and MongoDB
  hosts: all
  become: yes
  gather_facts: yes
  
  vars:
    app_dir: /opt/nodeapp
    ansible_python_interpreter: /usr/bin/python3

  tasks:
    - name: Update apt packages
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install required packages
      apt:
        name:
          - docker.io
          - docker-compose
          - npm
          - python3
          - python3-pip
        state: present
        update_cache: yes

    - name: Install Docker SDK for Python
      pip:
        name: docker
        state: present

    - name: Start and enable Docker
      service:
        name: docker
        state: started
        enabled: yes

    - name: Create application directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: '0755'

    - name: Create app subdirectory
      file:
        path: "{{ app_dir }}/app"
        state: directory
        mode: '0755'

    - name: Install PM2 globally
      npm:
        name: pm2
        global: yes
        state: present

    - name: Copy docker-compose file
      copy:
        dest: "{{ app_dir }}/docker-compose.yml"
        content: |
          version: '3'

          services:
            nginx:
              image: nginx:latest
              container_name: nginx
              ports:
                - "80:80"
              restart: unless-stopped
              networks:
                - app-network

            mongodb:
              image: mongo:latest
              container_name: mongodb
              ports:
                - "27017:27017"
              restart: unless-stopped
              networks:
                - app-network

            nodeapp:
              image: node:18
              container_name: nodeapp
              working_dir: /app
              volumes:
                - ./app:/app
              command: >
                sh -c "npm install &&
                       npx pm2-runtime app.js"
              ports:
                - "3000:3000"
              restart: unless-stopped
              networks:
                - app-network

          networks:
            app-network:
              driver: bridge
        mode: '0644'

    - name: Create sample Node.js application
      copy:
        dest: "{{ app_dir }}/app/app.js"
        content: |
          const http = require('http');
          const os = require('os');
          const mongoose = require('mongoose');

          // Simple HTTP server
          const server = http.createServer((req, res) => {
              res.writeHead(200, {'Content-Type': 'text/html'});
              res.write('<h1>E-Commerce Store</h1>');
              res.write('<ul>');
              res.write('<li>Laptop - $1200</li>');
              res.write('<li>Phone - $800</li>');
              res.write('<li>Tablet - $500</li>');
              res.write('</ul>');
              res.write(`<p>Host: ${os.hostname()}</p>`);
              res.write(`<p>Node.js Version: ${process.version}</p>`);
              res.end();
          });

          const PORT = 3000;
          server.listen(PORT, '0.0.0.0', () => {
              console.log(`Server running on port ${PORT}`);
              console.log(`Worker PID: ${process.pid}`);
          });
        mode: '0644'

    - name: Create package.json
      copy:
        dest: "{{ app_dir }}/app/package.json"
        content: |
          {
            "name": "nodeapp",
            "version": "1.0.0",
            "main": "app.js",
            "scripts": {
              "start": "node app.js",
              "dev": "nodemon app.js"
            },
            "dependencies": {
              "express": "^4.18.2"
            }
          }
        mode: '0644'

    - name: Create package-lock.json (empty to avoid warnings)
      copy:
        dest: "{{ app_dir }}/app/package-lock.json"
        content: |
          {
            "name": "nodeapp",
            "version": "1.0.0",
            "lockfileVersion": 2
          }
        mode: '0644'

    - name: Run Docker Compose
      docker_compose:
        project_src: "{{ app_dir }}"
        files:
          - docker-compose.yml
        state: present
        restarted: yes
      register: compose_output

    - name: Display compose output
      debug:
        msg: "{{ compose_output }}"
      when: compose_output is defined

    - name: Wait for containers to be ready
      pause:
        seconds: 10

    - name: Check if containers are running
      command: docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"
      register: docker_ps
      changed_when: false

    - name: Display running containers
      debug:
        msg: "{{ docker_ps.stdout_lines }}"

    - name: Check if nginx is accessible
      uri:
        url: "http://localhost"
        status_code: 200
        timeout: 5
      register: nginx_check
      ignore_errors: yes
      retries: 3
      delay: 5

    - name: Display nginx status
      debug:
        msg: "Nginx is {{ 'accessible' if nginx_check.status == 200 else 'not accessible' }}"

    - name: Get ALB DNS name (if running on AWS)
      command: curl -s http://169.254.169.254/latest/meta-data/public-hostname
      register: alb_dns
      ignore_errors: yes
      when: ansible_ec2_metadata is defined

    - name: Display access information
      debug:
        msg: |
          ===================================
          Deployment Complete!
          ===================================
          Access the application at:
          - Nginx: http://{{ ansible_default_ipv4.address }}:80
          - Node App: http://{{ ansible_default_ipv4.address }}:3000
          - MongoDB: mongodb://{{ ansible_default_ipv4.address }}:27017
          ===================================
